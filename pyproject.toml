[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dick-cli"
version = "0.1.0"
description = "Make text worse. Keep it recognizable."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "DICK contributors"}]
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.scripts]
dick = "dick.cli:main"

[tool.setuptools]
packages = ["dick"]
